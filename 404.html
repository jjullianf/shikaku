.nav-links a:hover{color:var(--gold)}
@media(max-width:480px){.nav-logo-text{display:none}}

main{flex:1;display:flex;align-items:center;justify-content:center;padding:56px 24px 80px}

/* Animated grid */
.grid-wrap{margin:0 auto 40px;width:120px;height:120px;position:relative}
.grid-svg{width:120px;height:120px;opacity:.85}
.grid-cell{fill:none;stroke:var(--border);stroke-width:1}
.rect{fill:rgba(138,111,58,0.12);stroke:var(--gold);stroke-width:1.5;rx:2;ry:2;opacity:0;animation:popIn 0.4s ease forwards}
.rect:nth-child(1){animation-delay:0.1s}
.rect:nth-child(2){animation-delay:0.3s}
.rect:nth-child(3){animation-delay:0.5s}
.rect:nth-child(4){animation-delay:0.7s}
.rect:nth-child(5){animation-delay:0.9s}
.clue{fill:var(--ink2);font-family:'DM Mono',monospace;font-size:8px;font-weight:500;opacity:0;animation:popIn 0.3s ease forwards}
.clue:nth-child(6){animation-delay:0.15s}
.clue:nth-child(7){animation-delay:0.35s}
.clue:nth-child(8){animation-delay:0.55s}
.clue:nth-child(9){animation-delay:0.75s}
.clue:nth-child(10){animation-delay:0.95s}
@keyframes popIn{from{opacity:0;transform:scale(0.8)}to{opacity:1;transform:scale(1)}}

.error-code{font-family:'Noto Serif JP',serif;font-weight:300;font-size:5rem;letter-spacing:.05em;color:var(--paper3);line-height:1;margin-bottom:4px;animation:fadeUp .5s ease both}
.error-title{font-family:'Noto Serif JP',serif;font-weight:300;font-size:1.4rem;letter-spacing:.1em;color:var(--ink);margin-bottom:12px;animation:fadeUp .5s ease .1s both}
.error-sub{font-size:.76rem;color:var(--ink3);letter-spacing:.05em;line-height:1.8;margin-bottom:36px;animation:fadeUp .5s ease .2s both}

.btn-row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;animation:fadeUp .5s ease .3s both}
.btn{display:inline-flex;align-items:center;gap:8px;font-family:'DM Mono',monospace;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;padding:10px 22px;border:1px solid var(--border);background:var(--paper2);color:var(--ink2);cursor:pointer;border-radius:var(--r);transition:all var(--t);text-decoration:none}
.btn:hover{background:var(--paper3);color:var(--ink);border-color:var(--gold2)}
.btn-gold{background:var(--gold)!important;color:var(--paper)!important;border-color:var(--gold)!important}
.btn-gold:hover{background:var(--gold2)!important;border-color:var(--gold2)!important}

@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:480px){.error-code{font-size:3.5rem}.error-title{font-size:1.1rem}}
